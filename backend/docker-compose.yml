version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: darktrust_admin
      POSTGRES_PASSWORD: secure_postgres_password
      POSTGRES_DB: darktrust_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darktrust_admin -d darktrust_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://darktrust_admin:secure_postgres_password@db:5432/darktrust_db
      - SECRET_KEY=super-secret-jwt-key-change-me-in-production
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    # Run Alembic migrations automatically before starting the server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
