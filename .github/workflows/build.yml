name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD Pipeline
#
# Triggers on:
#   - Push to main or develop branches
#   - Pull Requests targeting main
#
# Jobs:
#   1. build-and-test  → Compile + unit tests
#   2. docker-build    → Build all Docker images (runs after tests pass)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

jobs:

  # ── Job 1: Build & Unit Tests ────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven       # Cache ~/.m2 between runs for faster builds

      - name: Build all modules (skip tests)
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        run: mvn -B test
        env:
          # Use placeholder values so tests that read env vars don't fail
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_API_KEY: test-key
          KAFKA_API_SECRET: test-secret
          POSTGRES_HOST: localhost
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
          JWT_SECRET: test-secret-key-for-ci-at-least-32-chars

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()     # Upload even if tests fail
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ── Job 2: Docker Build Validation ───────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test      # Only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build producer-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: producer-service/Dockerfile
          push: false
          tags: log-platform/producer-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build alert-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: alert-service/Dockerfile
          push: false
          tags: log-platform/alert-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard-service/Dockerfile
          push: false
          tags: log-platform/dashboard-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
