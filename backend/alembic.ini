# DarkTrust – Zero Trust Security Platform
# Alembic Configuration File
#
# This file is read by `alembic` for migration commands.
# The [alembic] section configures the migration environment.
# Database URL is loaded from the .env file via env.py.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated file timestamps
timezone = UTC

# Truncate long revision slugs at this length
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# sqlalchemy.url is NOT set here — it is loaded dynamically in env.py
# from the DATABASE_SYNC_URL environment variable.

[post_write_hooks]
# Post-write hooks run after generating migration files.
# Uncomment to auto-format generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
